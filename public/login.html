<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 - 부스 A/S 알림 지도</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>부스 A/S 알림 지도</h1>
    <form id="login-form">
      <label>
        아이디
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>
        비밀번호
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">로그인</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
    <p class="auth-switch">
      계정이 없으신가요? <button type="button" class="link-btn" id="show-signup-btn">회원가입</button>
    </p>

    <form id="signup-form" hidden>
      <label>
        아이디
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>
        표시 이름
        <input type="text" name="displayName" autocomplete="name" />
      </label>
      <label>
        비밀번호(8자 이상)
        <input type="password" name="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label>
        비밀번호 확인
        <input type="password" name="passwordConfirm" autocomplete="new-password" required />
      </label>
      <button type="submit">회원가입 신청</button>
      <p id="signup-error" class="error" role="alert"></p>
      <p id="signup-success" class="status-msg" role="status"></p>
    </form>
    <p class="auth-switch" id="back-to-login-row" hidden>
      이미 계정이 있으신가요? <button type="button" class="link-btn" id="show-login-btn">로그인</button>
    </p>
  </div>
</div>
<script src="/login.js"></script>
</body>
</html>
